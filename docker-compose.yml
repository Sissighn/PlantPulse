services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantpulse-backend
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_PATH: /app/data/plants.db
      FRONTEND_ORIGINS: http://localhost,http://localhost:5173
    volumes:
      - backend-data:/app/data
      - ./backend/public/plantImages:/app/public/plantImages
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantpulse-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  backend-data:
