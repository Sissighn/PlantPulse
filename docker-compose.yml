services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantpulse-backend
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_PATH: /app/data/plants.db
      FRONTEND_ORIGINS: http://localhost,http://localhost:5173
    volumes:
      - backend-data:/app/data
      - ./backend/public/plantImages:/app/public/plantImages
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantpulse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
