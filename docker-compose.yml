version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantpulse-backend
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mounte die Datenbank und Bilder als Volume, damit sie bei Container-Neustarts nicht gelöscht werden
      - ./backend/src/db:/app/src/db
      - ./backend/public/plantImages:/app/public/plantImages
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantpulse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
